name: Build ZMK Firmware

on:
  push:
    paths:
      - '**.keymap'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup West and Zephyr
        uses: zmkfirmware/zephyr-action@v1
        with:
          manifest-path: 'modu-module/config'

      - name: Build Firmware
        run: |
          zmk-build -b xiao_ble -- -DSHIELD=modu_left -DZMK_CONFIG="$(pwd)/modu-module/boards/shields/modu"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modu-firmware
          path: build/zephyr/*.uf2
