name: Build ZMK Firmware

on:
  push:
    paths:
      - '**.keymap'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        shield: [modu_left, modu_right]
    steps:
      - name: Checkout modu-c-firmware
        uses: actions/checkout@v4

      - name: Checkout ZMK
        uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          path: zmk

      - name: Init and update west workspace
        working-directory: zmk/app
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Build ${{ matrix.shield }}
        working-directory: zmk/app
        run: |
          west build -d build/${{ matrix.shield }} -b ms88sf3/nrf52840 -p auto -- \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/modu-module;${GITHUB_WORKSPACE}/zmk-pmw3610-driver" \
            -DSHIELD=${{ matrix.shield }}

      - name: Convert to UF2
        run: |
          python3 tools/uf2/uf2conv.py -f 0xADA52840 -c -o ${{ matrix.shield }}.uf2 zmk/app/build/${{ matrix.shield }}/zephyr/zmk.hex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shield }}-firmware
          path: ${{ matrix.shield }}.uf2
